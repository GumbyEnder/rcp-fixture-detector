[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rcp-fixture-detector"
version = "0.1.0"
description = "Detect and count ceiling-mounted fixtures from Reflected Ceiling Plan PDFs"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.0",
    "pymupdf>=1.23",
    "paddleocr>=2.7",
    "paddlepaddle>=2.5",
    "albumentations>=1.3",
    "click>=8.1",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "tqdm>=4.65",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
rcp-detect = "rcp_detector.cli:cli"

[tool.setuptools.packages.find]
include = ["rcp_detector*"]
